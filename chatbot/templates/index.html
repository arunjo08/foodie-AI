<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ chatbot_name }}</title>
<style>
:root{--bg:#fff8f0;--panel:#fff;--text:#241a16;--muted:#7d6c64;--accent:#e85d04;--bubble:#fff0df}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% 15%,#ffbe5c47,transparent 30%),radial-gradient(circle at 85% 85%,#ff704333,transparent 30%),var(--bg);color:var(--text);display:grid;place-items:center;padding:18px}
.shell{width:min(960px,100%);height:min(820px,94vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid #4127191a;border-radius:30px;background:#ffffffeb;backdrop-filter:blur(18px);box-shadow:0 30px 80px #502a1429}
header{padding:22px 25px;display:flex;align-items:center;gap:15px;border-bottom:1px solid #4127191a}.logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:27px;background:#fff1dd}.title h1{margin:0;font-size:21px}.title p{margin:4px 0 0;color:var(--muted);font-size:13px}
#chat{flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:16px}.message{max-width:min(76%,650px);padding:14px 17px;border-radius:19px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;animation:appear .18s ease-out}.assistant{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:5px}.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}.typing{color:var(--muted);font-style:italic;background:#f6eee7}.error{color:#a42a1a;background:#ffe8e2}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.composer{padding:17px;border-top:1px solid #4127191a;background:#ffffffb3}form{display:flex;gap:10px;align-items:flex-end}textarea{flex:1;min-height:50px;max-height:130px;resize:none;border:1px solid #41271921;border-radius:17px;outline:none;padding:14px 16px;font:inherit;background:#fff;color:var(--text)}textarea:focus{border-color:#e85d0480;box-shadow:0 0 0 4px #e85d0414}button{width:52px;height:50px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:20px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.hint{margin:9px 3px 0;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:620px){body{padding:0}.shell{height:100vh;border-radius:0}#chat{padding:18px}.message{max-width:88%}header{padding:17px}.composer{padding:11px}}
</style>
</head>
<body>
<main class="shell">
<header><div class="logo">🍽️</div><div class="title"><h1>{{ chatbot_name }}</h1><p>Your food-focused AI companion</p></div></header>
<section id="chat" aria-live="polite"><div class="message assistant">Hi! 🍳 I’m Foodie AI. Ask me about food, recipes, ingredients, cooking, cuisines, or food safety.</div></section>
<div class="composer">
<form id="chatForm"><textarea id="messageInput" rows="1" placeholder="Ask a food-related question..." required></textarea><button id="sendButton" type="submit" aria-label="Send">➤</button></form>
<div class="hint">Food-related questions only</div>
</div>
</main>
<script>
const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("messageInput"),send=document.getElementById("sendButton"),history=[];
function addMessage(role,text,extra=""){const el=document.createElement("div");el.className=`message ${role} ${extra}`;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
form.addEventListener("submit",async e=>{
e.preventDefault();const message=input.value.trim();if(!message||send.disabled)return;
addMessage("user",message);history.push({role:"user",content:message});input.value="";input.style.height="auto";send.disabled=true;
const typing=addMessage("assistant","Thinking about that... 🍳","typing");
try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history})});const data=await r.json();typing.remove();if(!r.ok)throw new Error(data.error||"Unable to get a response.");addMessage("assistant",data.reply);history.push({role:"model",content:data.reply})}
catch(err){typing.remove();addMessage("assistant",err.message||"Something went wrong. Please try again.","error");history.pop()}
finally{send.disabled=false;input.focus()}
});
</script>
</body>
</html>
